name: Build on Linux

# Build and run tests on ubuntu-latest.
# The built binary is uploaded for later use in test-branch.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    strategy:
      matrix:
        ocaml-compiler:
          # Don't include every versions. OCaml-CI already covers that
          - 4.14.x

    runs-on: ubuntu-latest

    steps:
      # Clone the project
      - uses: actions/checkout@v7
        with:
          # Don't checkout the implicit merge commit to avoid wrong substitution
          ref: ${{ github.event.pull_request.head.sha }}

      # Setup
      - name: Setup OCaml ${{ matrix.ocaml-version }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Opam dependencies
        run: opam install --deps-only -t .

      - name: Format
        run: opam exec -- dune fmt

      - name: Build
        run: |
          opam exec -- dune subst
          opam exec -- dune build -p ocamlformat-lib,ocamlformat

      - name: Runtest
        run: opam exec -- dune runtest

      - name: Check manpages
        run: opam exec -- dune build @gen_manpage --auto-promote

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ocamlformat-${{ runner.os }}-${{ runner.arch }}
          path: _build/install/default/bin/ocamlformat

  test-branch:
    if: ${{ github.ref != 'refs/heads/main' }}
    needs: build-linux
    runs-on: ubuntu-latest

    steps:

      # Clone the project
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/cache@v5
        with:
          path: test-extra/code
          key: test-extra-code

      - name: Fetch main build of ocamlformat
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: build-linux.yml
          workflow_conclusion: ""
          check_artifacts: true
          branch: main
          name: ocamlformat-${{ runner.os }}-${{ runner.arch }}
          path: ocamlformat-a

      - name: Fetch new build of ocamlformat
        uses: actions/download-artifact@v8
        with:
          name: ocamlformat-${{ runner.os }}-${{ runner.arch }}
          path: ocamlformat-b

      - name: Setup tests
        run: |
          cat > test_branch.sh <<EOF
          ./tools/test_branch.sh -n -a ocamlformat-a/ocamlformat -b ocamlformat-b/ocamlformat
          EOF
          chmod +x ocamlformat-a/ocamlformat ocamlformat-b/ocamlformat

      - name: Test conventional profile
        run: bash test_branch.sh profile=conventional

      - name: Test ocamlformat profile
        run: bash test_branch.sh -l profile=ocamlformat

      - name: Test janestreet profile
        run: bash test_branch.sh -l profile=janestreet
