name: Build on Dune PM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        runs-on: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.runs-on }}
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use dune
        uses: ocaml-dune/setup-dune@v2
